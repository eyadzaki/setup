name: Update YouTube videos and stream frame

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-videos.mjs
      - name: Latest Kick gameplay frame
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          node scripts/update-stream.mjs
        continue-on-error: true   # Kick may block datacenter IPs; the site keeps the last frame
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json data/stream.json assets/screens/kick-stream.jpg 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update latest videos and stream frame"
          git push
